name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: srm
          POSTGRES_PASSWORD: srm
          POSTGRES_DB: srm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://srm:srm@localhost:5432/srm?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @codea-srm/db generate

      - run: pnpm --filter @codea-srm/db exec prisma migrate deploy

      - run: pnpm lint

      - run: pnpm typecheck

      - name: "DEBUG env passthrough"
        run: |
          echo "=== shell sees ==="
          echo "DATABASE_URL=$DATABASE_URL"
          echo "=== direct exec (bypass turbo) sees ==="
          pnpm --filter @codea-srm/core exec node -e "console.log('DATABASE_URL=', process.env.DATABASE_URL)"
          echo "=== through turbo run test sees ==="
          pnpm exec turbo run test --filter=@codea-srm/core 2>&1 || true

      - run: pnpm test
